# https://github.com/bitwarden/clients — Bitwarden browser extension, Chrome build (GPL-3.0)
# Resolved at setup time: the newest release whose tag starts with TAG_PREFIX, and in it the
# asset matching ASSET. The download is checked against the sha256 digest GitHub records for it.
NAME="bitwarden"
REPO="bitwarden/clients"
TAG_PREFIX="browser-v"               # the repo also releases desktop, cli, web under other prefixes
ASSET='^dist-chrome-[0-9.]+\.zip$'
# Public key injected into manifest.json: pins the extension ID to nkanlecjgnbjkjanadbbedolemolellk
# wherever the unpacked copy lives (unpacked IDs otherwise hash the path). Our own key, not the
# Web Store's, so chromium-web-store never offers a store "update" for it. prefs/ pins this ID.
KEY=""
